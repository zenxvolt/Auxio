name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older, still running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Clone repository and submodules
      uses: actions/checkout@v4
      with:
        # "media" (the ExoPlayer fork) and "taglib" are submodules, nothing builds without them.
        submodules: recursive
    - name: Install ninja-build
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build debug APK with Gradle
      run: ./gradlew app:assembleDebug
    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Debug_${{ github.run_number }}
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

  # The debug build is not what people actually run: it is not minified, it is not optimized by
  # the runtime and it logs a lot, so it feels noticeably slower than a released Auxio. Use this
  # APK to judge performance (i.e navigation, scrolling).
  release:
    name: Build release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Clone repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install ninja-build
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # The suffix lets this build be installed next to the official Auxio, which is signed with a
    # key that is not available here.
    - name: Build release APK with Gradle
      run: ./gradlew app:assembleRelease -Pauxio.applicationIdSuffix=.jellyfin
    # Gradle only produces an unsigned APK, and Android refuses to install those. To keep updates
    # installable over each other, add the repository secrets ANDROID_KEYSTORE_BASE64,
    # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see README). Without
    # them a throwaway key is used, which works for a one-off install but not for updating.
    - name: Sign release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/signing"
        mkdir -p "$work"

        if [ -n "${KEYSTORE_BASE64:-}" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$work/release.jks"
        else
          echo "::warning::No signing key configured, using a throwaway key. Updates of this APK can only be installed after uninstalling the previous one."
          echo "Signed with a throwaway key: this APK can't be installed over an earlier build." >> "$GITHUB_STEP_SUMMARY"
          KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          KEY_PASSWORD="$KEYSTORE_PASSWORD"
          KEY_ALIAS="auxio"
          keytool -genkeypair -keystore "$work/release.jks" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Auxio fork"
        fi
        export KEYSTORE_PASSWORD KEY_PASSWORD

        build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
        unsigned="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
        "$build_tools/zipalign" -f -p 4 "$unsigned" "$work/aligned.apk"
        mkdir -p release
        "$build_tools/apksigner" sign \
          --ks "$work/release.jks" --ks-key-alias "$KEY_ALIAS" \
          --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
          --out "release/Auxio-release.apk" "$work/aligned.apk"
        "$build_tools/apksigner" verify "release/Auxio-release.apk"
        rm -rf "$work"
    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Release_${{ github.run_number }}
        path: release/Auxio-release.apk
        if-no-files-found: error

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Clone repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install ninja-build
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run unit tests
      run: ./gradlew musikr:testDebug app:testDebugUnitTest
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Test_Reports_${{ github.run_number }}
        path: |
          app/build/reports/tests
          musikr/build/reports/tests
        if-no-files-found: ignore
